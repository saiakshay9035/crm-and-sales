name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest responses pytest-mock ruff
        
    - name: Run Ruff check
      run: |
        ruff check . --ignore BLE001,SIM117,S110,SIM102

        
    - name: Run Pytest
      run: |
        pytest tests/ -v --tb=short
